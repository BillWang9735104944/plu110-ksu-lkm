# Build KernelSU v3.3.1 LKM for OnePlus Turbo 6 (PLU110, android15-6.6)
#
# Why: the official prebuilt lkm-aarch64-android15-6.6 (v3.3.1 tag, same ddk
# image) imports 225 kernel symbols; on PLU110 exactly 12 are "Unknown symbol"
# in dmesg (verified by insmod). All 12 are referenced by the optional
# feature/selinux_hide.c; this build excludes it via KSU_NO_SELINUX_HIDE,
# leaving 213 imports - all of which the prebuilt proved to resolve on PLU110.
# (OnePlus's 6.6.118 kallsyms is LTO-pruned, so it looks like symtab_search /
# getenforce etc. are missing; they are actually exported - the module loader
# is the ground truth.)
#
# Pipeline mirrors tiann/KernelSU .github/workflows/ddk-lkm.yml (aarch64 job),
# pinned to tag v3.3.1 so the module version (30000 + git rev-list count)
# matches the official KernelSU Manager v3.3.1 APK (version 32680).
name: build-plu110-ksu-lkm

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build kernelsu.ko (android15-6.6, selinux_hide off)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android15-6.6-20260828
      options: --privileged

    steps:
      - name: Checkout this repo (patch)
        uses: actions/checkout@v7

      - name: Checkout KernelSU v3.3.1 (full history for version calc)
        uses: actions/checkout@v7
        with:
          repository: tiann/KernelSU
          ref: v3.3.1
          fetch-depth: 0
          path: kernelsu

      - name: Apply selinux_hide removal patch
        working-directory: kernelsu
        run: |
          git config --global --add safe.directory "$(pwd)"
          git apply -v ../no-selinux-hide.patch
          git diff --stat

      - name: Build kernelsu.ko (aarch64)
        working-directory: kernelsu/kernel
        run: |
          set -euo pipefail
          CONFIG_KSU=m CC=clang KSU_NO_SELINUX_HIDE=y make 2>&1 | tee build.log | tail -n 120
          echo "=== build log tail done, kernelsu.ko ==="
          ls -la kernelsu.ko
          command -v modinfo >/dev/null 2>&1 && modinfo kernelsu.ko || true

      - name: Verify no unexported selinux imports
        working-directory: kernelsu/kernel
        run: |
          NM=$(command -v llvm-nm || command -v nm)
          echo "=== undefined symbols (expect 213 = 225 prebuilt - 12 from selinux_hide.o) ==="
          $NM -u kernelsu.ko | sort
          #
          # The official prebuilt (same v3.3.1 tag, same ddk image) imported 225 kernel
          # symbols; on PLU110 exactly 12 of them were "Unknown symbol" in dmesg - all
          # referenced by feature/selinux_hide.o, which our patch excludes. All other
          # imports (incl. symtab_search, ebitmap_get_bit/set_bit, policydb_*, avc_ss_reset,
          # getenforce, ...) resolved fine on the device, so they are exported there.
          # Note: /proc/kallsyms on this device is LTO-pruned and NOT a reliable export
          # table - the prebuilt's own symbol table + insmod dmesg is the ground truth.
          if $NM -u kernelsu.ko | grep -wE 'ebitmap_destroy|ebitmap_cmp|ebitmap_contains|sidtab_context_to_sid|sidtab_search_entry|sidtab_sid2str_get|sidtab_sid2str_put|mls_context_to_sid|mls_compute_context_len|mls_sid_to_context|policydb_context_isvalid|cond_compute_av'; then
            echo "FAIL: one of the 12 PLU110-unknown symbols is still imported"
            exit 1
          fi
          echo "PASS: none of the 12 PLU110-unknown symbols are imported"

      - name: Upload kernelsu.ko
        uses: actions/upload-artifact@v7
        with:
          name: plu110-ksu-lkm-v3.3.1
          path: kernelsu/kernel/kernelsu.ko
